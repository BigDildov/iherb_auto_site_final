name: Update Promos

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  update-promos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Run parser
        run: node parser.js

      - name: Commit and push changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add promos.json
          git commit -m "Обновление акций"
          git push
