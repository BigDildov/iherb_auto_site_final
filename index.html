<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Скидки и промокоды iHerb — KCR0435</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🔥 Свежие скидки iHerb</h1>
    <p>Используй промокод <strong>KCR0435</strong> для дополнительной скидки!</p>
  </header>
  <main>
    <div id="promos" class="promos-grid">Загружаем акции...</div>
  </main>
  <footer>
    <p>© 2025 iHerb скидки. Промокод KCR0435</p>
  </footer>
  <script>
    async function loadPromos() {
      try {
        const res = await fetch('promos.json?cache=' + Date.now());
        const promos = await res.json();
        const container = document.getElementById('promos');
        container.innerHTML = '';
        promos.forEach(promo => {
          const div = document.createElement('div');
          div.className = 'promo-card';
          div.innerHTML = `
            <h3>${promo.title}</h3>
            <p>${promo.description}</p>
            <a href="${promo.link}" target="_blank">Перейти к акции</a>
          `;
          container.appendChild(div);
        });
      } catch (e) {
        document.getElementById('promos').innerText = 'Не удалось загрузить акции';
      }
    }
    loadPromos();
  </script>
</body>
</html>
